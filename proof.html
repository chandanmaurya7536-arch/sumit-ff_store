
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08060d">

<title>Customer Proofs | Sumit FF Store</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
.privacy-disclaimer {
  margin: 20px 0;
  padding: 20px;
  background: rgba(20, 16, 30, 0.9);
  border: 1px solid rgba(180, 140, 220, 0.25);
  border-radius: 16px;
  color: #aaa;
  font-family: Poppins, sans-serif;
  font-size: 14px;
  line-height: 1.8;
  text-align: left;
}
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #08060d;
  color: white;
  font-family: Poppins, sans-serif;
}

.topbar {
  height: 72px;
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 0 18px;
  background: #090909;
  border-bottom: 1px solid #30263b;
  position: sticky;
  top: 0;
  z-index: 10;
}

.back {
  width: 43px;
  height: 43px;
  border: 0;
  border-radius: 12px;
  background: #202020;
  color: #ffd700;
  font-size: 24px;
  cursor: pointer;
}

.topbar h1 {
  margin: 0;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 29px;
  letter-spacing: 1px;
  color: #ffd700;
}

.container {
  width: min(100% - 26px, 950px);
  margin: 25px auto;
}

.heading {
  text-align: center;
  margin-bottom: 25px;
}

.heading h2 {
  margin: 0;
  color: #ffd700;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 40px;
  letter-spacing: 1px;
}

.heading p {
  color: #aaa;
  font-size: 12px;
  margin: 5px 0;
}

.proof-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.proof-card {
  min-width: 0;
  overflow: hidden;
  border-radius: 16px;
  padding: 9px;
  background: linear-gradient(145deg,#251432,#101016);
  border: 1px solid rgba(190,115,255,.4);
  box-shadow: 0 0 15px rgba(139,45,255,.13);
}

.proof-title {
  color: #ffd700;
  font-size: 14px;
  font-weight: 700;
  margin: 2px 0 9px;
}

.slider {
  position: relative;
  width: 100%;
  height: 310px;
  background: #08080b;
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.slider img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: none;
  user-select: none;
  -webkit-user-drag: none;
}

.slider img.active {
  display: block;
}

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 34px;
  height: 42px;
  border: 0;
  border-radius: 9px;
  background: rgba(0,0,0,.72);
  color: #ffd700;
  font-size: 19px;
  cursor: pointer;
  z-index: 2;
}

.arrow.left {
  left: 7px;
}

.arrow.right {
  right: 7px;
}

.arrow:disabled {
  opacity: .25;
  cursor: default;
}

.counter {
  position: absolute;
  bottom: 8px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.75);
  color: white;
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 20px;
  z-index: 2;
}

.empty {
  display: none;
  padding: 35px 15px;
  text-align: center;
  border: 1px dashed #51445f;
  border-radius: 15px;
  color: #aaa;
}

.empty strong {
  display: block;
  color: #ffd700;
  margin-bottom: 8px;
}

.note {
  margin-top: 22px;
  padding: 13px;
  border-radius: 12px;
  background: #111018;
  border: 1px solid #30263b;
  color: #aaa;
  font-size: 11px;
  line-height: 1.7;
}

@media(max-width:520px) {
  .proof-grid {
    grid-template-columns: 1fr;
  }

  .slider {
    height: 360px;
  }
}

@media(min-width:700px) {
  .proof-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
</style>
</head>

<body>

<header class="topbar">
  <button class="back" type="button"
    onclick="history.length > 1 ? history.back() : location.href='index.html'">
    ←
  </button>

  <h1>SUMIT FF STORE</h1>
</header>

<main class="container">

  <section class="heading">
    <h2>CUSTOMER PROOFS</h2>
    <p>Real customer feedback and successful orders</p>
  </section>

  <section class="proof-grid" id="proofGrid"></section>

  <div class="empty" id="empty">
    <strong>PROOFS COMING SOON</strong>
    Customer screenshots will appear here.
  </div>

<div class="privacy-disclaimer">
  Customer details are kept private. Sensitive information is hidden to protect customer privacy.
</div>

</main>

<script>
const grid = document.getElementById("proofGrid");
const empty = document.getElementById("empty");

async function loadProofs() {

  try {

    const response = await fetch(
      "proofs/proofs.json?t=" + Date.now()
    );

    if (!response.ok) {
      throw new Error("Could not load proofs.json");
    }

    const proofData = await response.json();

    if (!Array.isArray(proofData)) {
      throw new Error("Invalid proofs.json format");
    }

    if (proofData.length === 0) {
      empty.style.display = "block";
      return;
    }

    let successfulCards = 0;

    proofData.forEach((proof) => {

      if (
        !proof.folder ||
        !Array.isArray(proof.images) ||
        proof.images.length === 0
      ) return;

      const card = document.createElement("div");
      card.className = "proof-card";
      card.style.display = "none";

      const title = document.createElement("div");
      title.className = "proof-title";
      title.textContent = proof.title || "Customer Proof";

      const slider = document.createElement("div");
      slider.className = "slider";

      const left = document.createElement("button");
      left.className = "arrow left";
      left.type = "button";
      left.textContent = "❮";

      const right = document.createElement("button");
      right.className = "arrow right";
      right.type = "button";
      right.textContent = "❯";

      const counter = document.createElement("div");
      counter.className = "counter";

      const images = [];
      let current = 0;
      let loadedCount = 0;
      let firstImageLoaded = false;

      function updateSlider() {

        const total = images.length;

        if (current >= total) {
          current = Math.max(0, total - 1);
        }

        images.forEach((img, index) => {
          img.classList.toggle(
            "active",
            index === current
          );
        });

        counter.textContent = total
          ? `${current + 1} / ${total}`
          : "No images";

        left.disabled = total <= 1;
        right.disabled = total <= 1;
      }

      function next() {
        if (!images.length) return;

        current = (current + 1) % images.length;
        updateSlider();
      }

      function previous() {
        if (!images.length) return;

        current =
          (current - 1 + images.length) % images.length;

        updateSlider();
      }

      left.addEventListener("click", previous);
      right.addEventListener("click", next);

      let startX = 0;

      slider.addEventListener("touchstart", (e) => {
        startX = e.changedTouches[0].screenX;
      }, { passive: true });

      slider.addEventListener("touchend", (e) => {

        const distance =
          e.changedTouches[0].screenX - startX;

        if (Math.abs(distance) > 45) {
          distance < 0 ? next() : previous();
        }

      }, { passive: true });

      proof.images.forEach((file, index) => {

        const img = document.createElement("img");

        img.alt =
          `${proof.title || "Customer Proof"} screenshot ${index + 1}`;

        img.loading = index === 0 ? "eager" : "lazy";

        img.onload = () => {

          loadedCount++;

          if (!firstImageLoaded) {

            firstImageLoaded = true;
            card.style.display = "block";

            successfulCards++;
            empty.style.display = "none";
          }

          updateSlider();
        };

        img.onerror = () => {

          const position = images.indexOf(img);

          if (position !== -1) {
            images.splice(position, 1);
          }

          updateSlider();
        };

        images.push(img);
        slider.appendChild(img);

        img.src =
          "proofs/" +
          encodeURIComponent(proof.folder) +
          "/" +
          encodeURIComponent(file);
      });

      slider.appendChild(left);
      slider.appendChild(right);
      slider.appendChild(counter);

      card.appendChild(title);
      card.appendChild(slider);

      grid.appendChild(card);

      updateSlider();

    });

    // Empty state remains hidden until all image requests settle.
    let pendingImages = 0;

    document.querySelectorAll(".proof-card img").forEach(img => {
      if (!img.complete) pendingImages++;
    });

    if (successfulCards === 0 && pendingImages === 0) {
      empty.style.display = "block";
    }

  } catch (error) {

    console.error("Proof loading error:", error);

    empty.style.display = "block";

    empty.innerHTML =
      "<strong>PROOFS COULD NOT LOAD</strong>" +
      "Check proofs/proofs.json and its folder path.";

  }

}

loadProofs();
</script>

</body>
</html>
