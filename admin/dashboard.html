<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="top">

<div class="brand">

<img src="../assets/logo.png">

<h2>SUMIT FF STORE</h2>

</div>

<button class="logout" onclick="logout()">Logout</button>

</header>

<section class="stats">

<div class="stat">
<span id="total">0</span>
<p>Total IDs</p>
</div>

<div class="stat">
<span id="available">0</span>
<p>Available</p>
</div>

<div class="stat">
<span id="soldCount">0</span>
<p>Sold</p>
</div>

</section>

<section class="upload-box">

<h1>Add New ID</h1>

<input id="title" placeholder="ID Name">

<input id="price" type="number" placeholder="Price">

<input id="level" placeholder="Level">

<input id="rank" placeholder="Rank">

<input id="evo" placeholder="Evo Guns">

<textarea id="desc" placeholder="Description"></textarea>

<input id="images" type="file" multiple accept="image/*">

<label class="switch">
<input id="sold" type="checkbox">
Mark as Sold
</label>

<button class="publish" onclick="addID()">Publish</button>

</section>

<section id="list" class="cards"></section>

<script type="module" src="admin.js"></script>

</body>
</html>
